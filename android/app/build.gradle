plugins {
    id 'com.android.application'
}

// Credenciales de firma: NUNCA en el repositorio. Se leen de android/local.properties
// (ignorado por git) o de variables de entorno.
def signingProps = new Properties()
def signingPropsFile = rootProject.file('local.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

def signingValue = { String key, String envName ->
    def value = signingProps.getProperty(key) ?: System.getenv(envName)
    return value == null || value.trim().isEmpty() ? null : value.trim()
}

def releaseStoreFile = signingValue('tejadosolar.storeFile', 'TEJADOSOLAR_STORE_FILE')
def releaseStorePassword = signingValue('tejadosolar.storePassword', 'TEJADOSOLAR_STORE_PASSWORD')
def releaseKeyAlias = signingValue('tejadosolar.keyAlias', 'TEJADOSOLAR_KEY_ALIAS')
def releaseKeyPassword = signingValue('tejadosolar.keyPassword', 'TEJADOSOLAR_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null }

def webDist = file("$rootDir/../dist")
def generatedAssets = layout.buildDirectory.dir("generated/webAssets")

android {
    namespace 'eus.usurbil.tejadosolar'
    compileSdk 34

    defaultConfig {
        applicationId 'eus.usurbil.tejadosolar'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress 'html', 'js', 'css', 'json', 'svg'
    }

    sourceSets {
        main {
            assets.srcDirs += [generatedAssets.get().asFile]
        }
    }
}

if (!hasReleaseSigning) {
    tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach {
        doFirst {
            throw new GradleException(
                "Faltan credenciales de firma. Anade tejadosolar.storeFile, tejadosolar.storePassword, " +
                "tejadosolar.keyAlias y tejadosolar.keyPassword a android/local.properties " +
                "(o define TEJADOSOLAR_STORE_FILE, TEJADOSOLAR_STORE_PASSWORD, TEJADOSOLAR_KEY_ALIAS y " +
                "TEJADOSOLAR_KEY_PASSWORD)."
            )
        }
    }
}

// Copia la web compilada (dist/) dentro de los assets del APK.
tasks.register('syncWebAssets', Copy) {
    from(webDist) {
        include '**/*'
    }
    into(generatedAssets.map { it.dir('site') })
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'syncWebAssets'
}
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn 'syncWebAssets'
}
